[project]
name = "hn-mcp"
version = "0.1.0"
description = "Hacker News knowledge base as an MCP server: 20 years of stories, trends and live threads for AI agents"
readme = "README.md"
authors = [
    { name = "lokih1028", email = "lokih141028@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
]

[project.scripts]
hn-mcp = "hn_mcp:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
